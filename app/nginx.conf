# Nginx config baked into the app container (replaces nginx's default.conf).
# Serves the static Vite build with SPA fallback + a health endpoint.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check for uptime monitoring (UptimeRobot) and the host proxy.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashed Vite assets are safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA client-side routing: any unmatched path falls back to index.html
    # so deep links like /game, /leaderboard, /share/:id work on direct load.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
