services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      # Passed into the build so Vite can inline them (read from the .env file
      # sitting next to this docker-compose.yml). See README "Deployment".
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "5173:80"
    restart: unless-stopped

  # Self-hosted monitoring dashboard. NOTE: runs on the same host as the app, so
  # it shares the same failure domain — it's for the dashboard / as a DevOps demo,
  # NOT the real safety net. The real external check is UptimeRobot hitting /health
  # from off-box (see README "Health & Monitoring").
  # Bound to localhost only; reach it via SSH tunnel or a host-Nginx subdomain proxy.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped

volumes:
  uptime-kuma-data:
