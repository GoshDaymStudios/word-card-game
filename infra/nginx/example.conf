# Example reverse-proxy config for the VPS HOST nginx (not the container).
# The app container exposes :80 and docker-compose maps it to host :5173
# (see docker-compose.yml -> "5173:80"). HTTPS / Let's Encrypt is assumed to
# already be handled on the host; this shows the proxy part.
#
# Install: copy to /etc/nginx/sites-available/word-card-game, edit server_name,
# symlink into sites-enabled, `nginx -t`, then reload.

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Proxy everything to the app container.
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /health is served by the container's nginx (returns 200 "ok"); it passes
    # through the location / proxy above, so UptimeRobot can hit
    # https://your-domain.com/health directly.
}
